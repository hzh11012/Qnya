worker_processes auto;
# worker 以 root 运行：NFS 挂载的媒体文件属主不是 nginx 用户(uid 101),
# 默认 worker 无读权限会导致 /media/ 全部 403(Permission denied);
# 容器内自部署环境，与主进程(root)一致即可
user root;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 媒体鉴权子请求专用 upstream：keepalive 复用 TCP 连接，
    # 避免视频 Range 密集请求时反复握手
    upstream app_auth {
        server localhost:3000;
        keepalive 16;
    }

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    # WebSocket 升级：客户端带 Upgrade 头时转发 "upgrade"，否则正常关闭连接
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/wasm;
    gzip_min_length 1024;

    # 前台（用户端）- 端口 5000
    server {
        listen 5000;

        # 媒体鉴权子请求（internal，仅限 auth_request 内部调用）
        location = /_media_auth {
            internal;
            proxy_pass              http://app_auth/api/media/auth-check;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            # 透传会话 Cookie 给应用校验
            proxy_set_header        Cookie $http_cookie;
            proxy_set_header        X-Original-URI $request_uri;
        }

        # 媒体文件（视频/图片）：已登录且角色高于游客可访问
        # ^~ 阻止下方静态资源正则块抢占 /media/ 下的图片请求
        # 视频拖动进度条依赖 Range，nginx 静态文件原生支持
        location ^~ /media/ {
            auth_request /_media_auth;
            alias /data/resources/;
            # 目录列表默认关闭（无 index 时 403），防枚举
            add_header Cache-Control "private, max-age=3600";
        }

        # HLS 媒体库同源反代（外部存储/对象存储）
        # 外部域名的 m3u8/ts 不带 Access-Control-Allow-Origin，hls.js 用 XHR 直连会被
        # 浏览器按 CORS 拦掉；经这里转发后对前端就是同源，无需对方改配置。
        # 剧集地址统一存 /hls/ 开头，dev 由 vite 的同名代理承担，行为一致。
        # ^~ 防止被下方静态资源正则块按扩展名抢走
        location ^~ /hls/ {
            proxy_pass              https://s3.qnets.cn/;
            proxy_ssl_server_name   on;
            proxy_set_header        Host s3.qnets.cn;
            proxy_http_version      1.1;
            # 分片是大文件连续读取，关缓冲让数据边收边发
            proxy_buffering         off;
            proxy_read_timeout      60s;
            add_header Cache-Control "public, max-age=3600";
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|wasm)$ {
            root /usr/share/nginx/frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location /api/ {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
        }

        # 放映室实时同步（Socket.IO）：不放行 Upgrade 会退化成长轮询或直接失败
        # 前缀 /socket.io/ 比 location / 更长，天然优先匹配，无需 ^~
        location /socket.io/ {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 握手复用会话 Cookie 校验身份，同源下自动透传，这里显式声明以防上游配置变更
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # 长连接不能被普通请求的超时掐断；服务端心跳 25s，留足冗余
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # 关了缓冲，消息才能即时下发（否则要攒满 buffer 才推）
            proxy_buffering off;
        }

        location / {
            root /usr/share/nginx/frontend;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # 后台管理面板 - 端口 5001
    server {
        listen 5001;

        # 媒体鉴权子请求（internal，仅限 auth_request 内部调用）
        location = /_media_auth {
            internal;
            proxy_pass              http://app_auth/api/media/auth-check;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            # 透传会话 Cookie 给应用校验
            proxy_set_header        Cookie $http_cookie;
            proxy_set_header        X-Original-URI $request_uri;
        }

        # 媒体文件（视频/图片）：已登录且角色高于游客可访问
        location ^~ /media/ {
            auth_request /_media_auth;
            alias /data/resources/;
            add_header Cache-Control "private, max-age=3600";
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|wasm)$ {
            root /usr/share/nginx/admin;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location /api/ {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
        }

        location / {
            root /usr/share/nginx/admin;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
