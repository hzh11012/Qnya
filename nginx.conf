worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 媒体鉴权子请求专用 upstream：keepalive 复用 TCP 连接，
    # 避免视频 Range 密集请求时反复握手
    upstream app_auth {
        server localhost:3000;
        keepalive 16;
    }

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/wasm;
    gzip_min_length 1024;

    # 前台（用户端）- 端口 5000
    server {
        listen 5000;

        # 媒体鉴权子请求（internal，仅限 auth_request 内部调用）
        location = /_media_auth {
            internal;
            proxy_pass              http://app_auth;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            # 透传会话 Cookie 给应用校验
            proxy_set_header        Cookie $http_cookie;
            proxy_set_header        X-Original-URI $request_uri;
        }

        # 媒体文件（视频/图片）：已登录且角色高于游客可访问
        # ^~ 阻止下方静态资源正则块抢占 /media/ 下的图片请求
        # 视频拖动进度条依赖 Range，nginx 静态文件原生支持
        location ^~ /media/ {
            auth_request /_media_auth;
            alias /data/resources/;
            # 目录列表默认关闭（无 index 时 403），防枚举
            add_header Cache-Control "private, max-age=3600";
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|wasm)$ {
            root /usr/share/nginx/frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location /api/ {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_read_timeout 60s;
        }

        location / {
            root /usr/share/nginx/frontend;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # 后台管理面板 - 端口 5001
    server {
        listen 5001;

        # 媒体鉴权子请求（internal，仅限 auth_request 内部调用）
        location = /_media_auth {
            internal;
            proxy_pass              http://app_auth;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            # 透传会话 Cookie 给应用校验
            proxy_set_header        Cookie $http_cookie;
            proxy_set_header        X-Original-URI $request_uri;
        }

        # 媒体文件（视频/图片）：已登录且角色高于游客可访问
        location ^~ /media/ {
            auth_request /_media_auth;
            alias /data/resources/;
            add_header Cache-Control "private, max-age=3600";
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|wasm)$ {
            root /usr/share/nginx/admin;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location /api/ {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_read_timeout 60s;
        }

        location / {
            root /usr/share/nginx/admin;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
