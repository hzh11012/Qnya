[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:app]
command=node dist/index.js
directory=/app
priority=10
autostart=true
autorestart=true
startsecs=3
# 预留足够的优雅关闭时间（Fastify 收到 SIGTERM 后会先处理完在途请求）
stopsignal=TERM
stopwaitsecs=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
