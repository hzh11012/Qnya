services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qnya}
      POSTGRES_USER: ${POSTGRES_USER:-qnya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-qnya}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.53.2
    restart: unless-stopped
    volumes:
      - meili_data:/meili_data
    environment:
      # 未设置时 Meilisearch 以无鉴权模式运行（仅容器网络内部可达）
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
      MEILI_NO_ANALYTICS: 'true'

  qbit:
    image: lscr.io/linuxserver/qbittorrent:4.4.5
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Shanghai
      WEBUI_PORT: 8080
    volumes:
      # 配置存 compose 命名卷（不映射宿主机）；下载目录指向 NAS/NFS
      - qbit_config:/config
      - ${QBIT_DATA_PATH:-./data/qbit}/downloads:/downloads
    ports:
      - '${QBIT_WEBUI_PORT:-8080}:8080'
      - '${QBIT_BT_PORT:-6881}:6881'
      - '${QBIT_BT_PORT:-6881}:6881/udp'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8080 || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5

  app:
    build:
      context: .
      args:
        FRONTEND_REPO: ${FRONTEND_REPO:-hzh11012/Qnya-Frontend}
        FRONTEND_VERSION: ${FRONTEND_VERSION:-}
        ADMIN_REPO: ${ADMIN_REPO:-hzh11012/Qnya-Backend}
        ADMIN_VERSION: ${ADMIN_VERSION:-}
    restart: unless-stopped
    ports:
      # 对外端口与容器内监听端口(PORT)彻底分离，避免同名变量互相覆盖
      - '${HTTP_PORT:-5000}:5000'
      - '${HTTP_ADMIN_PORT:-5001}:5001'
    # 与插值同源：compose 自动读取项目根目录 .env，
    # 应用配置与启动命令零参数
    env_file: .env
    environment:
      # 连接类变量，env_file 里无法预知，在此固定
      # 注意：应用读取的是分散的 POSTGRES_* 变量（见 src/plugins/external/db.ts），
      # 而非 DATABASE_URL，二者必须同时满足
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:-qnya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-qnya}
      REDIS_URL: redis://redis:6379
      # Meilisearch（必选，应用启动时会等待其就绪）
      # :- 确保 .env 里留空时也回退到服务名，避免 localhost 误注入容器
      MEILI_URL: ${MEILI_URL:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY-}
      QBIT_HOST: http://qbit:8080
      RESOURCE_ROOT_PATH: /data/resources
      QBIT_DOWNLOAD_PATH: /downloads
      # app 容器内下载目录（与下方 volumes 挂载保持一致）：
      # qbit 的下载目录同时作为资源根目录的子目录暴露，入库/媒体服务可直接读取
      QBIT_HOST_DOWNLOAD_PATH: /data/resources/downloads
      # 容器内监听端口固定为 3000（nginx 反代目标）。
      # .env.docker 中的 PORT 仅表示宿主机对外端口，
      # 若不在此覆盖，env_file 里的 PORT 会改掉应用监听端口导致 nginx 502
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qbit:
        condition: service_healthy
      meilisearch:
        condition: service_started
    volumes:
      # QBIT_DATA_PATH 必须在 HOST_RESOURCES_PATH 内；单独挂 downloads 会使入库 rename 报 EXDEV
      - ${HOST_RESOURCES_PATH:-./data/resources}:/data/resources

volumes:
  postgres_data:
  redis_data:
  meili_data:
  qbit_config:
